<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gguf</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    /* Shell chrome only — each panel brings its own styles inside its iframe.
       Palette matches the shared gguf design language (dark header, #4f6ef7). */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex; flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1f2937;
    }
    header {
      display: flex; align-items: center; gap: 4px;
      background: #1f2937; color: #e5e7eb;
      padding: 0 12px; height: 44px; flex: none;
    }
    .brand {
      display: flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 15px; margin-right: 16px; white-space: nowrap;
    }
    .brand img { width: 22px; height: 22px; }
    .brand .version { color: #9ca3af; font-weight: 400; font-size: 12px; }
    nav { display: flex; gap: 4px; height: 100%; }
    nav button {
      appearance: none; border: none; cursor: pointer;
      background: transparent; color: #9ca3af;
      font-size: 14px; font-weight: 500;
      padding: 0 16px; height: 100%;
      border-bottom: 2px solid transparent;
    }
    nav button:hover { color: #e5e7eb; }
    nav button.active { color: #ffffff; border-bottom-color: #4f6ef7; }
    main { flex: 1; position: relative; background: #ffffff; }
    main iframe {
      position: absolute; inset: 0; width: 100%; height: 100%;
      border: 0; display: none;
    }
    main iframe.active { display: block; }
  </style>
</head>
<body>
  <header>
    <span class="brand">
      <img src="logo.png" alt="" />
      ggk <span class="version" id="app-version">–</span>
    </span>
    <nav id="tabs">
      <button data-panel="server">Server</button>
      <button data-panel="diffuser">Diffuser</button>
      <button data-panel="editor">Editor</button>
    </nav>
  </header>
  <main id="panels">
    <iframe data-panel="server" title="LLM server panel"></iframe>
    <iframe data-panel="diffuser" title="Image generation panel"></iframe>
    <iframe data-panel="editor" title="GGUF editor panel"></iframe>
  </main>
  <script>
    'use strict';
    // Panels live under ./server/ ./diffuser/ ./editor/ on this same origin.
    // Iframes are lazy: a panel's URL is only assigned on first activation,
    // then kept alive so switching tabs never loses panel state.
    const tabs = Array.from(document.querySelectorAll('#tabs button'));
    const frames = Array.from(document.querySelectorAll('#panels iframe'));

    function activate(name, updateHash) {
      for (const tab of tabs) tab.classList.toggle('active', tab.dataset.panel === name);
      for (const frame of frames) {
        const on = frame.dataset.panel === name;
        if (on && !frame.src) frame.src = name + '/';
        frame.classList.toggle('active', on);
      }
      if (updateHash) history.replaceState(null, '', '#' + name);
    }

    for (const tab of tabs) {
      tab.addEventListener('click', () => activate(tab.dataset.panel, true));
    }

    const initial = location.hash.replace('#', '');
    activate(['server', 'diffuser', 'editor'].includes(initial) ? initial : 'server', false);

    fetch('server/api/status')
      .then((r) => r.json())
      .then((s) => { if (s.version) document.getElementById('app-version').textContent = 'v' + s.version; })
      .catch(() => {});
  </script>
</body>
</html>
